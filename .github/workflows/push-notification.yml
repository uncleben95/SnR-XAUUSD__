name: XAU/USD Automatic Push Notification

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-xauusd-signal:
    name: Check XAU/USD Signal
    runs-on: ubuntu-latest

    steps:
      - name: Check XAU/USD scalp API
        env:
          XAU_API_URL: ${{ secrets.XAU_API_URL }}
        run: |
          set -e

          if [ -z "$XAU_API_URL" ]; then
            echo "ERROR: XAU_API_URL GitHub Secret belum diset."
            exit 1
          fi

          echo "Checking XAU/USD signal..."
          echo "API: $XAU_API_URL"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 60 \
            -H "Accept: application/json" \
            "$XAU_API_URL")

          export RESPONSE

          echo "API response:"
          echo "$RESPONSE"

          node <<'NODE'
          const response = process.env.RESPONSE;

          if (!response) {
            console.error("Empty API response.");
            process.exit(1);
          }

          let data;

          try {
            data = JSON.parse(response);
          } catch (error) {
            console.error("API returned invalid JSON.");
            console.error(response);
            process.exit(1);
          }

          if (!data.ok) {
            console.error("Scalp API returned ok=false.");
            console.error(data);
            process.exit(1);
          }

          console.log("");
          console.log("======================================");
          console.log("       XAU/USD SIGNAL CHECK");
          console.log("======================================");
          console.log("Signal:", data.signal || "WAIT");
          console.log("Status:", data.status || "WAIT");
          console.log("Setup:", data.setupType || "--");
          console.log("Score:", data.score ?? "--");
          console.log("Price:", data.price ?? "--");
          console.log("Signal Candle:", data.signalCandle || "--");
          console.log("Signal Key:", data.signalKey || "--");
          console.log("======================================");
          console.log("");

          if (
            data.signal !== "BUY" &&
            data.signal !== "SELL" &&
            data.signal !== "WAIT"
          ) {
            console.error("Unknown signal:", data.signal);
            process.exit(1);
          }

          console.log("Signal check completed successfully.");
          NODE
