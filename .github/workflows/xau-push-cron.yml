name: XAUUSD Background Signal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger XAUUSD push engine
        env:
          XAU_APP_URL: ${{ secrets.XAU_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS \
            -H "x-push-cron-secret: ${CRON_SECRET}" \
            -H "cache-control: no-cache" \
            "${XAU_APP_URL}/api/push-cron?cron=$(date +%s)"
