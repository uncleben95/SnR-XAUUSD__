
name: XAU Signal Push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger XAU Scalp Engine
        shell: bash
        env:
          XAU_CRON_SECRET: ${{ secrets.XAU_CRON_SECRET }}
        run: |
          set -u

          if [ -z "${XAU_CRON_SECRET:-}" ]; then
            echo "ERROR: GitHub Secret XAU_CRON_SECRET belum diset."
            exit 1
          fi

          API_URL="https://sn-r-xauusd-ta3j.vercel.app/api/scalp?source=github-actions"

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 55 \
            --connect-timeout 15 \
            --retry 2 \
            --retry-delay 2 \
            --header "x-xau-cron-secret: ${XAU_CRON_SECRET}" \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "$API_URL" || true)

          echo "Malaysia: $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M:%S')"
          echo "HTTP STATUS: $HTTP_STATUS"
          echo "API RESPONSE:"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: API request failed."
            exit 1
          fi

          echo "API request completed."
