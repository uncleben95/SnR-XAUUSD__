    runs-on: ubuntu-latest

    steps:
      - name: Trigger XAU Scalp Engine
        run: |
          curl -fsS --max-time 120 \
            "https://sn-r-xauusd-ta3j.vercel.app/api/scalp?cron=1&ts=$(date +%s)"
