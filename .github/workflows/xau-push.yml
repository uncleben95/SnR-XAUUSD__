name: XAU Signal Push

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger XAU Scalp Engine
        shell: bash
        run: |
          set -u

          echo "=============================================="
          echo " XAUUSD SCALP SIGNAL ENGINE"
          echo "=============================================="
          echo "UTC      : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Malaysia : $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M:%S')"
          echo "=============================================="

          API_URL="https://sn-r-xauusd-ta3j.vercel.app/api/scalp?source=github-actions"

          echo "Calling:"
          echo "$API_URL"
          echo ""

          RESPONSE_FILE="$(mktemp)"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 55 \
            --connect-timeout 15 \
            --retry 2 \
            --retry-delay 2 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "$API_URL" || true)

          echo ""
          echo "HTTP STATUS: $HTTP_STATUS"
          echo "----------------------------------------------"

          if [ -s "$RESPONSE_FILE" ]; then
            cat "$RESPONSE_FILE"
          else
            echo "EMPTY RESPONSE FROM VERCEL"
          fi

          echo ""
          echo "----------------------------------------------"

          case "$HTTP_STATUS" in

            200)
              echo "SUCCESS"
              echo "Scalp engine executed successfully."
              echo "M5 trigger check completed."
              echo "----------------------------------------------"
              exit 0
              ;;

            401)
              echo "ERROR: HTTP 401"
              echo "Vercel Deployment Protection is blocking GitHub Actions."
              exit 1
              ;;

            404)
              echo "ERROR: HTTP 404"
              echo "The endpoint /api/scalp does not exist on this deployment."
              echo "Check the Vercel project root and API file location."
              exit 1
              ;;

            429)
              echo "ERROR: HTTP 429"
              echo "Rate limited. Next scheduled run will try again."
              exit 1
              ;;

            500)
              echo "ERROR: HTTP 500"
              echo "Scalp engine returned a server error."
              exit 1
              ;;

            502|503|504)
              echo "ERROR: HTTP $HTTP_STATUS"
              echo "Temporary Vercel/server problem."
              exit 1
              ;;

            000)
              echo "ERROR: Connection failed."
              echo "Could not connect to Vercel."
              exit 1
              ;;

            *)
              echo "ERROR: Unexpected HTTP status: $HTTP_STATUS"
              exit 1
              ;;

          esac
