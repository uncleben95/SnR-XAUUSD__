name: XAU Signal Push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger XAU Signal Engine
        run: |
          echo "======================================"
          echo "XAUUSDSNIPER BACKGROUND SIGNAL CHECK"
          echo "======================================"
          echo "Time: $(date -u)"

          RESPONSE=$(curl -sS \
            --max-time 55 \
            -w "\nHTTP_STATUS:%{http_code}" \
            "https://sn-r-xauusd-ta3j.vercel.app/api/scalp?source=github-actions")

          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Vercel API returned HTTP $STATUS"
            exit 1
          fi

          echo "XAU signal engine executed successfully."
