<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Signal Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f14;
    color: #e8edf3;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    color: #7f8b99;
    font-size: 12px;
    margin-top: 4px;
}

.status {
    font-size: 12px;
    color: #65d98b;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
}

.card {
    background: #111720;
    border: 1px solid #202936;
    border-radius: 12px;
    padding: 14px;
}

.label {
    color: #7f8b99;
    font-size: 11px;
    margin-bottom: 6px;
}

.value {
    font-size: 20px;
    font-weight: bold;
}

.signal-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.signal {
    font-size: 24px;
    font-weight: bold;
}

.signal.buy {
    color: #35d879;
}

.signal.sell {
    color: #ff5964;
}

.signal.wait {
    color: #f0bd4f;
}

.chart-box {
    background: #111720;
    border: 1px solid #202936;
    border-radius: 12px;
    overflow: hidden;
}

#chart {
    width: 100%;
    height: 520px;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
}

.info .card {
    min-height: 75px;
}

.footer {
    text-align: center;
    color: #66717e;
    font-size: 11px;
    margin-top: 15px;
}

@media(max-width: 700px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .info {
        grid-template-columns: 1fr 1fr;
    }

    #chart {
        height: 430px;
    }

    .value {
        font-size: 17px;
    }

    .signal {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <div class="title">XAU/USD Signal Dashboard</div>
            <div class="subtitle">5 Minute • EMA 20 / 50 / 100 / 200</div>
        </div>

        <div class="status" id="status">
            ● Connecting...
        </div>
    </div>

    <div class="cards">

        <div class="card">
            <div class="label">XAU/USD</div>
            <div class="value" id="price">---</div>
        </div>

        <div class="card">
            <div class="label">TREND</div>
            <div class="value" id="trend">---</div>
        </div>

        <div class="card signal-card">
            <div>
                <div class="label">SIGNAL</div>
                <div class="signal wait" id="signal">WAIT</div>
            </div>
        </div>

        <div class="card">
            <div class="label">UPDATE</div>
            <div class="value" id="update" style="font-size:13px">---</div>
        </div>

    </div>

    <div class="chart-box">
        <div id="chart"></div>
    </div>

    <div class="info">

        <div class="card">
            <div class="label">EMA 20</div>
            <div class="value" id="ema20">---</div>
        </div>

        <div class="card">
            <div class="label">EMA 50</div>
            <div class="value" id="ema50">---</div>
        </div>

        <div class="card">
            <div class="label">EMA 100</div>
            <div class="value" id="ema100">---</div>
        </div>

        <div class="card">
            <div class="label">EMA 200</div>
            <div class="value" id="ema200">---</div>
        </div>

        <div class="card">
            <div class="label">HIGH</div>
            <div class="value" id="high">---</div>
        </div>

        <div class="card">
            <div class="label">LOW</div>
            <div class="value" id="low">---</div>
        </div>

    </div>

    <div class="footer">
        Data provided by Twelve Data • Signal is technical analysis only
    </div>

</div>

<script>

let chart;
let candleSeries;
let ema20Series;
let ema50Series;
let ema100Series;
let ema200Series;

function createChart() {

    chart = LightweightCharts.createChart(
        document.getElementById("chart"),
        {
            layout: {
                background: {
                    color: "#111720"
                },
                textColor: "#8d99a8"
            },

            grid: {
                vertLines: {
                    color: "#1b232e"
                },
                horzLines: {
                    color: "#1b232e"
                }
            },

            rightPriceScale: {
                borderColor: "#28313d"
            },

            timeScale: {
                borderColor: "#28313d",
                timeVisible: true,
                secondsVisible: false
            }
        }
    );

    candleSeries = chart.addCandlestickSeries({
        upColor: "#35d879",
        downColor: "#ff5964",
        borderVisible: false,
        wickUpColor: "#35d879",
        wickDownColor: "#ff5964"
    });

    ema20Series = chart.addLineSeries({
        color: "#f0bd4f",
        lineWidth: 1
    });

    ema50Series = chart.addLineSeries({
        color: "#4da6ff",
        lineWidth: 1
    });

    ema100Series = chart.addLineSeries({
        color: "#b579ff",
        lineWidth: 1
    });

    ema200Series = chart.addLineSeries({
        color: "#ffffff",
        lineWidth: 2
    });

    window.addEventListener("resize", () => {

        chart.applyOptions({
            width: document.getElementById("chart").clientWidth
        });

    });
}


function calculateEMA(values, period) {

    if (values.length < period) {
        return [];
    }

    const multiplier = 2 / (period + 1);

    let ema = values
        .slice(0, period)
        .reduce((a, b) => a + b, 0) / period;

    const result = [];

    result.push(ema);

    for (let i = period; i < values.length; i++) {

        ema =
            ((values[i] - ema) * multiplier) +
            ema;

        result.push(ema);
    }

    return result;
}


function makeEMAData(candles, period) {

    const closes = candles.map(x => x.close);

    const ema = calculateEMA(closes, period);

    const result = [];

    const start = period - 1;

    for (let i = 0; i < ema.length; i++) {

        result.push({
            time: candles[start + i].time,
            value: ema[i]
        });

    }

    return result;
}


function formatPrice(value) {

    return Number(value).toFixed(2);

}


async function loadData() {

    try {

        document.getElementById("status").innerHTML =
            "● Updating...";

        const response = await fetch("/api/xau", {
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            throw new Error(data.error || "API error");
        }

        let candles = data.values
            .map(x => {

                return {
                    time: Math.floor(
                        new Date(
                            x.datetime.replace(" ", "T")
                        ).getTime() / 1000
                    ),

                    open: Number(x.open),
                    high: Number(x.high),
                    low: Number(x.low),
                    close: Number(x.close)
                };

            })
            .sort((a,b) => a.time - b.time);


        candleSeries.setData(candles);


        /*
        EMA
        */

        if (candles.length >= 200) {

            ema20Series.setData(
                makeEMAData(candles, 20)
            );

            ema50Series.setData(
                makeEMAData(candles, 50)
            );

            ema100Series.setData(
                makeEMAData(candles, 100)
            );

            ema200Series.setData(
                makeEMAData(candles, 200)
            );

        }


        /*
        Latest candle
        */

        const latest =
            candles[candles.length - 1];

        document.getElementById("price").textContent =
            formatPrice(latest.close);


        document.getElementById("high").textContent =
            formatPrice(latest.high);


        document.getElementById("low").textContent =
            formatPrice(latest.low);


        /*
        EMA values
        */

        const closes =
            candles.map(x => x.close);

        const ema20 =
            calculateEMA(closes, 20).at(-1);

        const ema50 =
            calculateEMA(closes, 50).at(-1);

        const ema100 =
            calculateEMA(closes, 100).at(-1);

        const ema200 =
            calculateEMA(closes, 200).at(-1);


        document.getElementById("ema20").textContent =
            formatPrice(ema20);

        document.getElementById("ema50").textContent =
            formatPrice(ema50);

        document.getElementById("ema100").textContent =
            formatPrice(ema100);

        document.getElementById("ema200").textContent =
            formatPrice(ema200);


        /*
        Trend + Signal
        */

        let trend = "SIDEWAYS";
        let signal = "WAIT";
        let signalClass = "wait";


        if (
            ema20 > ema50 &&
            ema50 > ema100 &&
            ema100 > ema200
        ) {

            trend = "BULLISH";

            if (latest.close > ema20) {
                signal = "BUY";
                signalClass = "buy";
            }

        }

        else if (
            ema20 < ema50 &&
            ema50 < ema100 &&
            ema100 < ema200
        ) {

            trend = "BEARISH";

            if (latest.close < ema20) {
                signal = "SELL";
                signalClass = "sell";
            }

        }


        document.getElementById("trend").textContent =
            trend;

        const signalElement =
            document.getElementById("signal");

        signalElement.textContent =
            signal;

        signalElement.className =
            "signal " + signalClass;


        /*
        Update time
        */

        const latestTime =
            new Date(latest.time * 1000);

        document.getElementById("update").textContent =
            latestTime.toLocaleTimeString(
                "ms-MY",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        document.getElementById("status").innerHTML =
            "● Live";


        chart.timeScale().fitContent();


    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            "● API Error";

    }

}


/*
START
*/

createChart();

loadData();


/*
Refresh setiap 30 saat
*/

setInterval(loadData, 30000);

</script>

</body>
</html>
